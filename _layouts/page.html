---
layout: default
---
<article class="post{% if page.wide %} post-wide{% endif %}">
  <header class="post-header">
    {% if page.heading %}<h1>{{ page.heading }}</h1>{% else %}<h1>{{ page.title }}</h1>{% endif %}
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
